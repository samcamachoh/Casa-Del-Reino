name: Hide events section once

on:
  push:
    paths:
      - '.github/workflows/hide-events-once.yml'

permissions:
  contents: write

jobs:
  hide-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide Events section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<section class="section section-dark" id="events">'
          new = '<section class="section section-dark" id="events" hidden>'
          if new in s:
              print('Events section is already hidden.')
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Events section tag was not found.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide events section"
          git push
