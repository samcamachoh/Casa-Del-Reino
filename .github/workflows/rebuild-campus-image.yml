name: Rebuild campus image

on:
  push:
    paths:
      - '.github/workflows/rebuild-campus-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild Campus.jpg
        shell: bash
        run: |
          cat campus-chunks/part*.b64 | tr -d '\n\r' | base64 --decode > Campus.jpg
          echo "77a4add8fa08686d860f583a9276626be893c0bd7e6b66ca5159d67edcba24dc  Campus.jpg" | sha256sum -c -
          file Campus.jpg

      - name: Commit repaired campus image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Campus.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Fix campus image asset"
          git push
